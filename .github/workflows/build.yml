name: Build CV PDFs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check preview synchronization and clean safety
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/build.sh

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-luatex texlive-latex-extra texlive-lang-european fonts-liberation fonts-texgyre

      - name: Build all themes and languages
        run: ./scripts/build.sh all

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: dist/**/cv-*.pdf
